<!doctype html>
<html lang="es">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>TP3 UXUI Ejercicio13</title>
        <link rel="stylesheet" href="styles.css">
    </head>
    <body>
        <h1>Ejercicio13: Formulario estilizado</h1>
        <form>
            <div id="Input_nombre">
                <label for="fname">Nombre:</label>
                <input type="text" id="fname" name="fname" placeholder="Nombre" required />
            </div>
            <div id="Input_email">
                <label for="email">Email:</label>
                <input type="email" id="email" name="email" placeholder="Email" required />
            </div>
            <div id="Input_mensaje">
                <label for="mensaje">Mensaje:</label>
                <textarea id="mensaje" name="mensaje" rows="5" placeholder="Deje su mensaje..." required></textarea>
            </div>
            <div id="submit_boton">
                <button type="submit">Enviar</button>
            </div>
        </form>
    </body>
</html>
