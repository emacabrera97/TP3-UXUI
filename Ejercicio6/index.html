<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TP3 UXUI Ejercicio6: Selectores CSS</title>
    <link rel="stylesheet" href="styles.css"/>
</head>
<body>
    <h1>TP3 UXUI Ejercicio6: Selectores CSS</h1>
    <div id="contenedor">
        <div id="encabezado">
            <p>Mi tienda de <span class="destacado">libros</span></p>
        </div>

        <div class="card">
            <p class="titulo">Cien años de soledad</p>
            <p>Autor: <span class="autor">Gabriel García Márquez</span></p>
            <p>Precio: <span class="precio">$12000</span></p>
        </div>

        <div class="card oferta">
            <p class="titulo">El Aleph</p>
            <p>Autor: <span class="autor">Jorge Luis Borges</span></p>
            <p>Precio: <span class="precio">$9000</span></p>
            <p class="aviso">¡Oferta por tiempo limitado!</p>
        </div>

        <div class="card">
            <p class="titulo">Rayuela</p>
            <p>Autor: <span class="autor">Julio Cortázar</span></p>
            <p>Precio: <span class="precio">$10500</span></p>
        </div>

        <div id="pie">
            <p>Envíos a todo el país. <span class="destacado">Consultá</span> por stock.</p>
        </div>
    </div>
</body>
</html>
