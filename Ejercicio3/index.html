<!doctype html>
<html lang="es">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>TP3 UXUI Ejercicio3</title>
    </head>
    <body>
        <table border="1">
            <caption>
                <!-- La etiqueta caption se utiliza exclusivamente para definir un
                tituo o descripcion de una tabla HTML.-->
                Horario semanal de clases
            </caption>

            <!-- ENCABEZADO -->
            <thead>
                <tr>
                    <th>Horario</th>
                    <th>Lunes</th>
                    <th>Martes</th>
                    <th>Miércoles</th>
                    <th>Jueves</th>
                    <th>Viernes</th>
                </tr>
            </thead>

            <!-- CUERPO -->
            <tbody>
                <tr>
                    <td>8:00</td>
                    <td rowspan="2">Matemática</td>
                    <td rowspan="2">Música</td>
                    <td rowspan="2">Geografía</td>
                    <td rowspan="2">Lengua</td>
                    <td>Ed. Física</td>
                </tr>
                <tr>
                    <td>9:00</td>
                    <!-- Lunes a Jueves ya ocupados por el rowspan de arriba -->
                    <td>Matemática</td>
                </tr>
                <tr>
                    <td>10:00</td>
                    <td rowspan="2">Lengua</td>
                    <td rowspan="2">Religión</td>
                    <td rowspan="2">Historia</td>
                    <td>Taller</td>
                    <td rowspan="2">Artes visuales</td>
                </tr>
                <tr>
                    <td>11:00</td>
                    <!-- Lunes, Martes y Miercoles ocupados por rowspan -->
                    <td>Matemática</td>
                    <!-- Viernes ocupado por rowspan -->
                </tr>
            </tbody>

            <!-- PIE -->
            <tfoot>
                <tr>
                    <td>12:00</td>
                    <td colspan="5">Fin de la jornada</td>
                </tr>
            </tfoot>
        </table>
    </body>
</html>
