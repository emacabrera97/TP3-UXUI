<!DOCTYPE html>
<html>
  <head>
    <title>TP3 UXUI Ejercicio19: Formulario multi-step con validación visual</title>
    <link rel="stylesheet" href="styles.css" />
  </head>

  <body>
    <form class="form-steps">
      <!-- Radios ocultos que controlan qué paso se ve -->
      <input
        type="radio"
        name="paso"
        id="paso1"
        class="radio-paso"
        checked
      />
      <input
        type="radio"
        name="paso"
        id="paso2"
        class="radio-paso"
      />

      <!-- Indicador visual de progreso -->
      <div class="indicador">
        <label for="paso1" class="punto">1</label>
        <label for="paso2" class="punto">2</label>
      </div>

      <!-- PASO 1 -->
      <section class="step step-1">
        <h2>Paso 1: Datos personales</h2>

        <div class="campo">
          <label for="nombre">Nombre:</label>
          <input
            type="text"
            id="nombre"
            name="nombre"
            required
            minlength="2"
          />
          <span class="mensaje-error">
            El nombre es obligatorio (mínimo 2 caracteres)
          </span>
        </div>

        <div class="campo">
          <label for="email">Email:</label>
          <input
            type="email"
            id="email"
            name="email"
            required
          />
          <span class="mensaje-error">Ingresá un email válido</span>
        </div>

        <label for="paso2" class="btn-siguiente">Siguiente →</label>
      </section>

      <!-- PASO 2 -->
      <section class="step step-2">
        <h2>Paso 2: Cuenta</h2>

        <div class="campo">
          <label for="usuario">Usuario:</label>
          <input
            type="text"
            id="usuario"
            name="usuario"
            required
            minlength="4"
          />
          <span class="mensaje-error">Mínimo 4 caracteres</span>
        </div>

        <div class="campo">
          <label for="password">Contraseña:</label>
          <input
            type="password"
            id="password"
            name="password"
            required
            minlength="6"
          />
          <span class="mensaje-error">Mínimo 6 caracteres</span>
        </div>

        <label for="paso1" class="btn-atras">← Atrás</label>
        <button type="submit">Registrarme</button>
      </section>
    </form>
  </body>
</html>
